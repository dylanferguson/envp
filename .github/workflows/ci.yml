name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.9.2
      - run: pnpm install --frozen-lockfile
      - run: mise run check
      - run: mise run test
      - run: pnpm exec playwright install --with-deps chromium
      - run: mise run test:e2e
      - run: mise run docker:build
        env:
          GIT_COMMIT: ${{ github.sha }}
      - run: node scripts/smoke-container.mjs
      - run: node scripts/smoke-nginx.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: playwright-results
          path: test-results/
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # 1.6
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      - run: |
          image="registry.fly.io/envp:${GITHUB_SHA}"
          nginx_image="registry.fly.io/envp:nginx-${GITHUB_SHA}"
          docker tag envp:go-scratch "$image"
          docker tag envp-nginx "$nginx_image"
          docker tag envp-nginx registry.fly.io/envp:nginx
          flyctl auth docker
          docker push "$image"
          docker push "$nginx_image"
          docker push registry.fly.io/envp:nginx
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    concurrency:
      group: fly-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # 1.6
      - run: |
          python3 - <<'PY'
          import json, os
          path = "deploy/fly-machine.json"
          data = json.load(open(path))
          sha = os.environ["GITHUB_SHA"]
          for container in data["containers"]:
              if container["name"] == "nginx":
                  container["image"] = f"registry.fly.io/envp:nginx-{sha}"
          json.dump(data, open(path, "w"), indent=2)
          open(path, "a").write("\n")
          PY
          flyctl deploy --image registry.fly.io/envp:${{ github.sha }} --ha=false
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
