name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: devenv shell -- bash -eo pipefail {0}
    steps:
      - uses: actions/checkout@v6.1.0
        with:
          persist-credentials: false
      - uses: DeterminateSystems/determinate-nix-action@v3.24.2
      # devenv from the same nixpkgs revision as flake.lock and devenv.yaml.
      - run: nix profile add "github:NixOS/nixpkgs/$(jq -r .nodes.nixpkgs.locked.rev flake.lock)#devenv"
        shell: bash
      - uses: actions/cache@v5.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
            ~/.cache/golangci-lint
          key: ${{ runner.os }}-go-${{ hashFiles('go.sum', '.golangci.yml', 'devenv.lock') }}
          restore-keys: |
            ${{ runner.os }}-go-
      - uses: actions/cache@v5.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
      - run: check
      - run: unit-tests
      - run: build-images
      - run: playwright install --only-shell
      - run: e2e-tests
      - run: docker compose -p envp-e2e down --volumes --remove-orphans
        if: always()
      - run: smoke-tests
      - uses: actions/upload-artifact@v7.0.1
        if: failure()
        with:
          name: playwright-results
          path: test-results/
      - uses: superfly/flyctl-actions/setup-flyctl@1.6
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      - run: |
          image="registry.fly.io/envp:${GITHUB_SHA}"
          docker tag envp:nix "$image"
          docker tag envp-nginx:nix registry.fly.io/envp:nginx
          flyctl auth docker
          docker push "$image"
          docker push registry.fly.io/envp:nginx
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    concurrency:
      group: fly-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6.1.0
        with:
          persist-credentials: false
      - uses: superfly/flyctl-actions/setup-flyctl@1.6
      - run: flyctl deploy --image registry.fly.io/envp:${{ github.sha }} --ha=false
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
