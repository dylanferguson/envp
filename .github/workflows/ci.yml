name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read
  actions: write

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GIT_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.9.2
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
            ~/.cache/golangci-lint
          key: ${{ runner.os }}-go-${{ hashFiles('go.sum', '.golangci.yml', 'mise.toml') }}
          restore-keys: |
            ${{ runner.os }}-go-
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile
      - run: mise run check
      - run: mise run test
      - uses: docker/bake-action@d3418bd7d0e9324001bca92fa8ba175ea7e6dc9b # v7.3.0
        with:
          files: compose.yaml
          load: true
          provenance: false
          # GHA cache is wired via `set` below; local compose is unchanged.
          set: |
            *.args.GIT_COMMIT=${{ github.sha }}
            envp.cache-from=type=gha,scope=envp
            envp.cache-to=type=gha,mode=max,scope=envp
            nginx.cache-from=type=gha,scope=nginx
            nginx.cache-to=type=gha,mode=max,scope=nginx
      - run: pnpm exec playwright install --only-shell
      - run: mise run test:e2e
        env:
          E2E_SKIP_BUILD: "1"
      - run: docker compose -p envp-e2e down --volumes --remove-orphans
        if: always()
      - run: mise run docker:build
      - run: node scripts/smoke-container.mjs
      - run: node scripts/smoke-nginx.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-results
          path: test-results/
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # 1.6
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      - run: |
          image="registry.fly.io/envp:${GITHUB_SHA}"
          docker tag envp:go-scratch "$image"
          docker tag envp-nginx registry.fly.io/envp:nginx
          flyctl auth docker
          docker push "$image"
          docker push registry.fly.io/envp:nginx
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    concurrency:
      group: fly-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # 1.6
      - run: flyctl deploy --image registry.fly.io/envp:${{ github.sha }} --ha=false
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
