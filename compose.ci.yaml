# Overlay for GitHub Actions. type=gha needs setup-buildx and actions:write.
# Keep this out of compose.yaml so local `docker compose build` stays offline.
# Scopes are per service so envp and nginx caches do not overwrite each other.
services:
  envp:
    build:
      cache_from:
        - type=gha,scope=envp
      cache_to:
        - type=gha,mode=max,scope=envp,ignore-error=true
  nginx:
    build:
      cache_from:
        - type=gha,scope=nginx
      cache_to:
        - type=gha,mode=max,scope=nginx,ignore-error=true
