# Change app and PUBLIC_ORIGIN together if deploying under another name.
# Behind Cloudflare, PUBLIC_ORIGIN must be the proxied hostname, not *.fly.dev.
app = "envp"
primary_region = "syd"
kill_signal = "SIGTERM"
kill_timeout = 15

[build]
dockerfile = "Dockerfile"

[experimental]
machine_config = "deploy/fly-machine.json"
container = "envp"

[env]
PORT = "8081"
LISTEN_HOST = "127.0.0.1"
INTERNAL_PORT = "9090"
DB_PATH = "/data/shares.db"
PUBLIC_ORIGIN = "https://envp.dylanferguson.co"

[[mounts]]
source = "envp_data"
destination = "/data"
initial_size = "1gb"

[http_service]
internal_port = 8080
force_https = true
auto_stop_machines = "stop"
auto_start_machines = true
min_machines_running = 0

[metrics]
port = 9090
path = "/metrics"

[checks]
[checks.health]
type = "http"
port = 9090
method = "GET"
path = "/health"
interval = "30s"
timeout = "3s"
grace_period = "10s"

[[vm]]
cpu_kind = "shared"
cpus = 1
memory = "512mb"
