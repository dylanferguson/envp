# Change app and PUBLIC_ORIGIN together if deploying under another name.
#
# Topology: Cloudflare (client IP + per-IP rate limits) -> Fly [http_service] -> :8080.
# The Go process is a share store. It does not read CF-Connecting-IP, Fly-Client-IP,
# or X-Forwarded-For. There is no TRUST_PROXY; setting it has no effect.
#
# Cloudflare owns the per-client write/read ceiling and holds it across Fly cold
# starts (auto_stop_machines / min_machines_running = 0). The in-process limiter
# is a coarse fuse on RemoteAddr (on Fly, the proxy hop — one bucket for everyone).
#
# PUBLIC_ORIGIN must be the Cloudflare-proxied hostname, not *.fly.dev.
# *.fly.dev bypasses Cloudflare; do not treat it as a public app URL.
app = "envp"
primary_region = "syd"
kill_signal = "SIGTERM"
kill_timeout = 15

[build]
dockerfile = "Dockerfile"

[env]
PORT = "8080"
INTERNAL_PORT = "9090"
DB_PATH = "/data/shares.db"
PUBLIC_ORIGIN = "https://envp.dylanferguson.co"

[[mounts]]
source = "envp_data"
destination = "/data"
initial_size = "1gb"

[http_service]
internal_port = 8080
force_https = true
auto_stop_machines = "stop"
auto_start_machines = true
min_machines_running = 0

[metrics]
port = 9090
path = "/metrics"

[checks]
[checks.health]
type = "http"
port = 9090
method = "GET"
path = "/health"
interval = "30s"
timeout = "3s"
grace_period = "10s"

[[vm]]
cpu_kind = "shared"
cpus = 1
memory = "256mb"
