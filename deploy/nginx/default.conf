map $request_method $create_addr {
	default "";
	POST $binary_remote_addr;
}

map $uri $cache_control {
	default "no-cache";
	~^/assets/ "public, max-age=31536000, immutable";
	/robots.txt "public, max-age=86400";
}

limit_req_zone $create_addr zone=create:10m rate=45r/m;
limit_req_zone $binary_remote_addr zone=read:10m rate=60r/s;
limit_req_status 429;

server {
	listen 0.0.0.0:8080;
	listen [::]:8080;
	server_name ~\.fly\.dev$;
	return 403;
}

server {
	listen 0.0.0.0:8080 default_server;
	listen [::]:8080 default_server;
	root /usr/share/nginx/html;
	client_max_body_size 128k;

	set_real_ip_from 10.0.0.0/8;
	set_real_ip_from 172.16.0.0/12;
	set_real_ip_from 192.168.0.0/16;
	set_real_ip_from 127.0.0.1;
	set_real_ip_from ::1;
	set_real_ip_from fd00::/8;
	real_ip_header CF-Connecting-IP;

	rewrite ^/share/[^/]+/?$ /open.html last;

	location /api/ {
		proxy_http_version 1.1;
		proxy_set_header Host $http_host;
		proxy_pass http://127.0.0.1:8081;
	}

	location = /api/v1/shares {
		limit_req zone=create burst=15 nodelay;
		proxy_http_version 1.1;
		proxy_set_header Host $http_host;
		proxy_pass http://127.0.0.1:8081;
	}

	location /api/v1/shares/ {
		limit_req zone=read burst=30 nodelay;
		proxy_http_version 1.1;
		proxy_set_header Host $http_host;
		proxy_pass http://127.0.0.1:8081;
	}

	location / {
		include /etc/nginx/security_headers.conf;
		add_header Cache-Control $cache_control;
		try_files $uri $uri/ $uri.html =404;
	}
}
