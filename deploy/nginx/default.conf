# Rate-limit keys use the real client IP.
#
# Fly's edge sets Fly-Client-IP and strips client-supplied Fly-* headers, so
# it always reflects whoever connected to the edge. Cloudflare connects from
# its published ranges and sets CF-Connecting-IP to the visitor IP; that
# header is trusted only then. Update ranges from https://www.cloudflare.com/ips/
geo $http_fly_client_ip $from_cloudflare {
	default 0;
	173.245.48.0/20 1;
	103.21.244.0/22 1;
	103.22.200.0/22 1;
	103.31.4.0/22 1;
	141.101.64.0/18 1;
	108.162.192.0/18 1;
	190.93.240.0/20 1;
	188.114.96.0/20 1;
	197.234.240.0/22 1;
	198.41.128.0/17 1;
	162.158.0.0/15 1;
	104.16.0.0/13 1;
	104.24.0.0/14 1;
	172.64.0.0/13 1;
	131.0.72.0/22 1;
	2400:cb00::/32 1;
	2606:4700::/32 1;
	2803:f800::/32 1;
	2405:b500::/32 1;
	2405:8100::/32 1;
	2a06:98c0::/29 1;
	2c0f:f248::/32 1;
}

map $http_fly_client_ip $edge_client_ip {
	default $http_fly_client_ip;
	"" $binary_remote_addr; # no Fly edge in front (compose): socket peer
}

map $from_cloudflare $client_ip {
	1 $http_cf_connecting_ip;
	default $edge_client_ip;
}

map $request_method $create_addr {
	default "";
	POST $client_ip;
}

map $uri $cache_control {
	default "no-cache";
	~^/assets/ "public, max-age=31536000, immutable";
	/robots.txt "public, max-age=86400";
}

map $uri $retry_after {
	default 1;
	/api/v1/shares 2;
}

limit_req_zone $create_addr zone=create:10m rate=45r/m;
limit_req_zone $client_ip zone=read:10m rate=60r/s;
limit_req_status 429;
limit_req_log_level notice; # below error_log so 429s stay JSON-only

map $status $loggable {
	default 0;
	413 1;
	429 1;
	500 1;
	502 1;
	503 1;
	504 1;
}

map $status $log_level {
	default "WARN";
	~^5 "ERROR";
}

map $status $log_msg {
	413 "payload too large";
	429 "rate limited";
	500 "request failed";
	502 "upstream error";
	503 "upstream error";
	504 "upstream error";
}

map $upstream_status $log_upstream {
	default $upstream_status;
	"" "-";
}

map $uri $log_route {
	default "other";
	/api/v1/shares "create";
	~^/api/v1/shares/ "get";
}

log_format envp escape=json
	'{"time":"$time_iso8601","level":"$log_level","msg":"$log_msg",'
	'"logger":"nginx",'
	'"status":$status,'
	'"method":"$request_method",'
	'"route":"$log_route",'
	'"request_time":$request_time,'
	'"upstream_status":"$log_upstream"}';

access_log /var/log/nginx/access.log envp if=$loggable;
log_not_found off;

server {
	listen 0.0.0.0:8080;
	listen [::]:8080;
	server_name ~\.fly\.dev$;
	return 403;
}

server {
	listen 0.0.0.0:8080 default_server;
	listen [::]:8080 default_server;
	root /usr/share/nginx/html;
	client_max_body_size 128k;

	# write-origin-token.sh builds this map from X_ORIGIN_TOKEN (fly secrets
	# in prod, compose env in dev). Cloudflare sets the header at the edge,
	# so it is absent on direct-to-edge traffic, which fails closed here.
	if ($origin_denied) { return 403; }

	rewrite ^/share/[^/]+/?$ /open.html last;
	error_page 429 = @rate_limited;

	location @rate_limited {
		default_type application/json;
		add_header Retry-After $retry_after always;
		add_header Cache-Control no-store always;
		return 429 '{"error":{"code":"rate_limited","message":"Too many requests. Try again later."}}\n';
	}

	location /api/ {
		proxy_http_version 1.1;
		proxy_set_header Host $http_host;
		proxy_pass http://127.0.0.1:8081;
	}

	location = /api/v1/shares {
		limit_req zone=create burst=15 nodelay;
		proxy_http_version 1.1;
		proxy_set_header Host $http_host;
		proxy_pass http://127.0.0.1:8081;
	}

	location /api/v1/shares/ {
		limit_req zone=read burst=30 nodelay;
		proxy_http_version 1.1;
		proxy_set_header Host $http_host;
		proxy_pass http://127.0.0.1:8081;
	}

	location / {
		include /etc/nginx/security_headers.conf;
		add_header Cache-Control $cache_control;
		try_files $uri $uri/ $uri.html =404;
	}
}
