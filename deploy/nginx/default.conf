limit_req_zone $binary_remote_addr zone=create:10m rate=45r/m;
limit_req_zone $binary_remote_addr zone=read:10m rate=60r/s;
limit_req_status 429;

server {
	listen 8080;
	listen [::]:8080;
	server_name ~\.fly\.dev$;
	return 403;
}

server {
	listen 8080 default_server;
	listen [::]:8080 default_server;
	root /usr/share/nginx/html;

	set_real_ip_from 10.0.0.0/8;
	set_real_ip_from 172.16.0.0/12;
	set_real_ip_from 192.168.0.0/16;
	set_real_ip_from 127.0.0.1;
	set_real_ip_from ::1;
	set_real_ip_from fd00::/8;
	real_ip_header CF-Connecting-IP;
	real_ip_recursive on;

	client_max_body_size 128k;
	error_page 429 = @rate_limited;
	include /etc/nginx/security_headers.conf;

	location @rate_limited {
		default_type application/json;
		add_header Retry-After 1 always;
		include /etc/nginx/security_headers.conf;
		return 429 '{"error":{"code":"rate_limited","message":"Too many requests. Try again later."}}\n';
	}

	location = /api/v1/shares {
		limit_req zone=create burst=15 nodelay;
		proxy_http_version 1.1;
		proxy_set_header Host $http_host;
		proxy_set_header Connection "";
		proxy_read_timeout 15s;
		proxy_send_timeout 15s;
		proxy_pass http://127.0.0.1:8081;
	}

	location /api/v1/shares/ {
		limit_req zone=read burst=30 nodelay;
		proxy_http_version 1.1;
		proxy_set_header Host $http_host;
		proxy_set_header Connection "";
		proxy_read_timeout 15s;
		proxy_send_timeout 15s;
		proxy_pass http://127.0.0.1:8081;
	}

	location /api/ {
		proxy_http_version 1.1;
		proxy_set_header Host $http_host;
		proxy_set_header Connection "";
		proxy_read_timeout 15s;
		proxy_send_timeout 15s;
		proxy_pass http://127.0.0.1:8081;
	}

	location = / {
		add_header Cache-Control "no-cache" always;
		include /etc/nginx/security_headers.conf;
		try_files /index.html =404;
	}

	location = /open {
		add_header Cache-Control "no-cache" always;
		include /etc/nginx/security_headers.conf;
		try_files /open.html =404;
	}

	location ~ ^/share/[^/]+/?$ {
		add_header Cache-Control "no-cache" always;
		include /etc/nginx/security_headers.conf;
		try_files /open.html =404;
	}

	location = /robots.txt {
		add_header Cache-Control "public, max-age=86400" always;
		include /etc/nginx/security_headers.conf;
	}

	location /assets/ {
		add_header Cache-Control "public, max-age=31536000, immutable" always;
		include /etc/nginx/security_headers.conf;
	}

	location / {
		try_files $uri =404;
	}
}
