map $request_method $create_addr {
	default "";
	POST $binary_remote_addr;
}

map $uri $cache_control {
	default "no-cache";
	~^/assets/ "public, max-age=31536000, immutable";
	/robots.txt "public, max-age=86400";
}

map $uri $retry_after {
	default 1;
	/api/v1/shares 2;
}

limit_req_zone $create_addr zone=create:10m rate=45r/m;
limit_req_zone $binary_remote_addr zone=read:10m rate=60r/s;
limit_req_status 429;
limit_req_log_level notice; # below error_log so 429s stay JSON-only

map $status $loggable {
	default 0;
	413 1;
	429 1;
	500 1;
	502 1;
	503 1;
	504 1;
}

map $status $log_level {
	default "WARN";
	~^5 "ERROR";
}

map $status $log_msg {
	413 "payload too large";
	429 "rate limited";
	500 "request failed";
	502 "upstream error";
	503 "upstream error";
	504 "upstream error";
}

map $upstream_status $log_upstream {
	default $upstream_status;
	"" "-";
}

map $uri $log_route {
	default "other";
	/api/v1/shares "create";
	~^/api/v1/shares/ "get";
}

log_format envp escape=json
	'{"time":"$time_iso8601","level":"$log_level","msg":"$log_msg",'
	'"logger":"nginx",'
	'"status":$status,'
	'"method":"$request_method",'
	'"route":"$log_route",'
	'"request_time":$request_time,'
	'"upstream_status":"$log_upstream"}';

access_log /var/log/nginx/access.log envp if=$loggable;
log_not_found off;

server {
	listen 0.0.0.0:8080;
	listen [::]:8080;
	server_name ~\.fly\.dev$;
	return 403;
}

server {
	listen 0.0.0.0:8080 default_server;
	listen [::]:8080 default_server;
	root /usr/share/nginx/html;
	client_max_body_size 128k;

	set_real_ip_from 10.0.0.0/8;
	set_real_ip_from 172.16.0.0/12;
	set_real_ip_from 192.168.0.0/16;
	set_real_ip_from 127.0.0.1;
	set_real_ip_from ::1;
	set_real_ip_from fd00::/8;
	real_ip_header CF-Connecting-IP;

	rewrite ^/share/[^/]+/?$ /open.html last;
	error_page 429 = @rate_limited;

	location @rate_limited {
		default_type application/json;
		add_header Retry-After $retry_after always;
		add_header Cache-Control no-store always;
		return 429 '{"error":{"code":"rate_limited","message":"Too many requests. Try again later."}}\n';
	}

	location /api/ {
		proxy_http_version 1.1;
		proxy_set_header Host $http_host;
		proxy_pass http://127.0.0.1:8081;
	}

	location = /api/v1/shares {
		limit_req zone=create burst=15 nodelay;
		proxy_http_version 1.1;
		proxy_set_header Host $http_host;
		proxy_pass http://127.0.0.1:8081;
	}

	location /api/v1/shares/ {
		limit_req zone=read burst=30 nodelay;
		proxy_http_version 1.1;
		proxy_set_header Host $http_host;
		proxy_pass http://127.0.0.1:8081;
	}

	location / {
		include /etc/nginx/security_headers.conf;
		add_header Cache-Control $cache_control;
		try_files $uri $uri/ $uri.html =404;
	}
}
