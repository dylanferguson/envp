# Tools come from the Nix dev shell (`nix develop`); mise only runs tasks.

[settings]
# Stop a global mise install from shadowing the dev shell's tools.
disable_tools = ["go", "node", "pnpm", "npm:pnpm", "golangci-lint", "watchexec"]

[tasks.api]
description = "Go API, restarting on Go file changes"
run = "watchexec -r -e go,mod,sum -w cmd -w internal -w go.mod -w go.sum -- go run ./cmd/envp"

[tasks.dev]
description = "Vite UI + Go API"
run = 'concurrently -k -n web,api -c cyan,magenta "vp dev" "mise run api"'

[tasks.build]
description = "Go API binary"
run = "CGO_ENABLED=0 go build -trimpath -ldflags=\"-s -w -X main.commit=${GIT_COMMIT:-$(git rev-parse HEAD)}\" -o dist/envp ./cmd/envp"

[tasks.start]
description = "Run the API binary"
run = "./dist/envp"

[tasks.test]
description = "Frontend unit tests and Go tests"
run = ["vp test run", "go test -race ./..."]

[tasks.check]
description = "Frontend checks and golangci-lint"
run = ["vp check", "golangci-lint run"]

[tasks."test:e2e"]
description = "Playwright against docker compose (nginx + API)"
depends = ["image"]
run = "playwright test"

[tasks."test:e2e:install"]
description = "Install Playwright browsers"
run = "playwright install --with-deps --only-shell"

[tasks.image]
description = "Build both images with Nix and load them as envp:nix and envp-nginx:nix"
run = '''
sys="${NIX_IMAGE_SYSTEM:-$(uname -m | sed s/arm64/aarch64/)-linux}"
for image in envp-image nginx-image; do
  nix build ".#packages.$sys.$image" -o "result-$image" && docker load < "result-$image"
done
'''

[tasks.smoke]
description = "Smoke-test both images"
depends = ["image"]
run = ["node scripts/smoke-container.mjs", "node scripts/smoke-nginx.mjs"]

[tasks.up]
description = "Run nginx + API in docker compose"
depends = ["image"]
run = "docker compose up"
