[tools]
go = "1.27.1"
node = "24.20.0"
pnpm = "11.22.0"
golangci-lint = "2.13.2"
watchexec = "2.7.2"

[env]
_.path = ["{{config_root}}/node_modules/.bin"]

[tasks.api]
description = "Go API, restarting on Go file changes"
run = "watchexec -r -e go,mod,sum -w cmd -w internal -w go.mod -w go.sum -- go run ./cmd/envp"

[tasks.dev]
description = "Vite UI + Go API"
run = 'concurrently -k -n web,api -c cyan,magenta "vp dev" "mise run api"'

[tasks.build]
description = "Go API binary"
run = "CGO_ENABLED=0 go build -trimpath -ldflags=\"-s -w -X main.commit=${GIT_COMMIT:-$(git rev-parse HEAD)}\" -o dist/envp ./cmd/envp"

[tasks.start]
description = "Run the API binary"
run = "./dist/envp"

[tasks.test]
description = "Frontend unit tests and Go tests"
run = ["vp test run", "go test -race ./..."]

[tasks.check]
description = "Frontend checks and golangci-lint"
run = ["vp check", "golangci-lint run"]

[tasks."test:e2e"]
description = "Playwright against docker compose (nginx + API)"
run = "playwright test"

[tasks."test:e2e:install"]
description = "Install Playwright browsers"
run = "playwright install --with-deps --only-shell"

[tasks."docker:build"]
run = 'GIT_COMMIT="${GIT_COMMIT:-$(git rev-parse HEAD)}" docker compose build'

[tasks."docker:run"]
run = "docker compose up --build"

[tasks."cf:build"]
description = "Vite UI into the Cloudflare Worker public/ directory"
run = "vp build && mkdir -p templates/cloudflare/public && cp -a dist/client/. templates/cloudflare/public/"

[tasks."cf:dev"]
description = "Wrangler Worker + D1 + built UI"
run = "mise run cf:build && pnpm --dir templates/cloudflare exec wrangler d1 migrations apply envp --local && pnpm --dir templates/cloudflare exec wrangler dev --port 8787"

[tasks."cf:test"]
description = "Cloudflare Worker tests"
run = "pnpm --dir templates/cloudflare test"

[tasks."cf:smoke"]
description = "Hit a running wrangler dev instance with encrypt/create/open"
run = "node templates/cloudflare/scripts/smoke.mjs"
