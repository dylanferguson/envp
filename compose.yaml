services:
  envp:
    image: envp:nix # build-images
    environment:
      PORT: "8081"
      LISTEN_HOST: "127.0.0.1"
    ports:
      - "8080:8080"
      - "127.0.0.1:9090:9090"
    volumes:
      - envp-data:/data
    restart: unless-stopped
    stop_grace_period: 15s
  nginx:
    image: envp-nginx:nix
    environment:
      X_ORIGIN_TOKEN: ${X_ORIGIN_TOKEN:-envp-dev-token}
    network_mode: service:envp
    depends_on:
      envp:
        condition: service_healthy
    restart: unless-stopped

volumes:
  envp-data:
    name: envp-data
