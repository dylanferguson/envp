services:
  envp:
    build:
      context: .
      target: envp
      args:
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
    image: envp:go-scratch
    environment:
      PORT: "8081"
      LISTEN_HOST: "127.0.0.1"
    ports:
      - "8080:8080"
      - "127.0.0.1:9090:9090"
    volumes:
      - envp-data:/data
    restart: unless-stopped
    stop_grace_period: 15s
  nginx:
    build:
      context: .
      target: nginx
      args:
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
    image: envp-nginx
    network_mode: service:envp
    depends_on:
      envp:
        condition: service_healthy
    restart: unless-stopped

volumes:
  envp-data:
    name: envp-data
